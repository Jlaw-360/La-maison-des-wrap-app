<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portail Livreur - La Maison des Wraps</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-body: #060608;
      --bg-main: #0B0B0F;
      --bg-surface: #14141A;
      --bg-card: #181822;
      --primary: #FF5500;
      --accent-green: #22C55E;
      --accent-blue: #3B82F6;
      --accent-gold: #E5A93C;
      --border: rgba(255, 255, 255, 0.08);
      --text-white: #FFFFFF;
      --text-body: #A2A2B4;
      --text-muted: #6E6E80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-body);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .driver-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-online { background: rgba(34, 197, 94, 0.15); border: 1px solid #22C55E; color: #22C55E; }
    .status-offline { background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; color: #EF4444; }

    .driver-content {
      padding: 16px 18px 30px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }

    .kpi-val { font-size: 22px; font-weight: 900; color: #FF5500; margin-top: 4px; }
    .kpi-lbl { font-size: 11px; color: var(--text-muted); font-weight: 700; }

    .delivery-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .delivery-card.active-delivery {
      border-color: #FF5500;
      background: rgba(255, 85, 0, 0.04);
    }

    .btn-action-driver {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-nav-map { background: #3B82F6; color: #fff; text-decoration: none; }
    .btn-take-order { background: #FF5500; color: #fff; }
    .btn-verify-pin { background: #22C55E; color: #000; }

    /* Toast */
    #driverToast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #1C1C24;
      color: #FFFFFF;
      border: 1.5px solid #FF5500;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <header>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 20px;">🛵</span>
      <div>
        <h2 style="font-size: 15px; font-weight: 900;">Portail Livreur</h2>
        <p style="font-size: 10px; color: var(--text-muted);">Drummondville Dispatch</p>
      </div>
    </div>

    <div class="driver-status-pill status-online" id="pillStatus" onclick="toggleDriverDuty()">
      <span style="font-size: 8px;">●</span>
      <span id="lblStatusText">En Service</span>
    </div>
  </header>

  <div class="driver-content">
    <!-- Driver Identity & Privacy Bar -->
    <div style="background: #14141A; border: 1px solid var(--border); border-radius: 18px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: rgba(255,85,0,0.15); display: flex; align-items: center; justify-content: center; color: #FF5500; font-weight: 900; font-size: 14px;">🛵</div>
        <div>
          <div style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 800;">Livreur Actif</div>
          <div style="font-size: 13px; font-weight: 900; color: #FFFFFF;" id="lblActiveDriverName">Marc Livreur</div>
        </div>
      </div>
      <button onclick="changeDriverName()" style="background: #27272A; border: 1px solid rgba(255,255,255,0.08); color: #FF5500; font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 8px; cursor: pointer;">
        Changer Profil
      </button>
    </div>

    <!-- Personal Telemetry (Strictly Isolated to This Driver) -->
    <div class="kpi-row" style="margin-bottom: 14px;">
      <div class="kpi-card" style="flex: 1;">
        <div class="kpi-lbl">Mes Courses Complétées</div>
        <div class="kpi-val" id="lblDriverRunsCount">0</div>
      </div>
      <div class="kpi-card" style="flex: 1;">
        <div class="kpi-lbl">Mes Courses en Cours</div>
        <div class="kpi-val" style="color: #3B82F6;" id="lblDriverActiveCount">0</div>
      </div>
    </div>

    <!-- Section Title & PIN Handshake Claim Box -->
    <div style="background: #14141A; border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 13px; font-weight: 800; text-transform: uppercase; color: #FFFFFF; letter-spacing: 0.5px;">
          🔢 Prise en Charge Tablette Cuisine
        </span>
        <span style="font-size: 10px; font-weight: 900; background: rgba(255,85,0,0.2); color: #FF5500; padding: 2px 8px; border-radius: 6px;">
          PIN 4 Chiffres
        </span>
      </div>
      <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px;">
        Entrez le code PIN affiché sur la tablette cuisine pour assigner la commande prête :
      </p>
      <form onsubmit="handleClaimByPin(event)" style="display: flex; gap: 8px;">
        <input 
          type="text" 
          id="inputTabletPin" 
          maxlength="4" 
          inputmode="numeric" 
          pattern="[0-9]*" 
          placeholder="Ex: 5232" 
          style="flex: 1; text-align: center; font-family: monospace; font-size: 22px; font-weight: 900; letter-spacing: 4px; background: #0B0B0F; border: 1px solid #27272A; color: #FF5500; border-radius: 12px; padding: 8px; outline: none;"
          required
        >
        <button 
          type="submit" 
          style="background: #FF5500; border: none; color: #FFFFFF; font-weight: 800; font-size: 13px; padding: 0 18px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,85,0,0.3);"
        >
          Valider
        </button>
      </form>
    </div>

    <!-- Active Deliveries Section Title -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="font-size: 15px; font-weight: 800;">Mes Livraisons Assignées</h3>
      <button onclick="refreshDriverDeliveries()" style="background: transparent; border: none; color: #FF5500; font-size: 12px; font-weight: 700; cursor: pointer;"><i class="fa-solid fa-arrows-rotate"></i> Actualiser</button>
    </div>

    <!-- Active Deliveries List -->
    <div id="driverOrdersContainer" style="display: flex; flex-direction: column; gap: 14px;">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

<script>
let isOnline = true;
let activeDriverName = localStorage.getItem('lmdw_driver_name') || 'Marc Livreur';
let capturedDoorPhotos = {};

const SUPABASE_URL = 'https://zldxbaykxgdraxvejkdr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ljj5EaZpRUDBuIPvd9Z89Q_A6Gr1qRy';

function changeDriverName() {
  const newName = prompt("Entrez votre prénom ou nom de livreur :", activeDriverName);
  if (newName && newName.trim()) {
    activeDriverName = newName.trim();
    localStorage.setItem('lmdw_driver_name', activeDriverName);
    document.getElementById('lblActiveDriverName').innerText = activeDriverName;
    renderDeliveries();
    showToast(`Profil activé : ${activeDriverName}`, '👤');
  }
}

function toggleDriverDuty() {
  isOnline = !isOnline;
  const pill = document.getElementById('pillStatus');
  const lbl = document.getElementById('lblStatusText');
  if (isOnline) {
    pill.className = 'driver-status-pill status-online';
    lbl.innerText = 'En Service';
    showToast('Vous êtes désormais en ligne.', '🟢');
  } else {
    pill.className = 'driver-status-pill status-offline';
    lbl.innerText = 'Hors Service';
    showToast('Vous êtes hors service.', '🔴');
  }
  renderDeliveries();
}

function getOrdersFromStorage() {
  try {
    const raw = localStorage.getItem('lmdw_all_orders');
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return [];
}

function saveOrdersToStorage(orders) {
  localStorage.setItem('lmdw_all_orders', JSON.stringify(orders));
}

async function fetchLiveDriverOrders() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc&limit=50`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        const mapped = data.map(o => ({
          id: o.order_number || o.id,
          orderNumber: o.order_number || o.id,
          customerName: o.customer_name || 'Client',
          customerPhone: o.customer_phone || '',
          deliveryAddress: o.delivery_address || '',
          fulfillment: o.fulfillment_type || o.order_type || 'delivery',
          dropoffOption: o.dropoff_option || 'hand',
          total: o.total_amount || o.total_cad || 0,
          status: o.status || o.order_status || 'new',
          pickupPin: o.pickup_pin || o.backup_pin || '5232',
          pickup_pin: o.pickup_pin || o.backup_pin || '5232',
          securityPin: o.pickup_pin || o.backup_pin || '5232',
          driver_name: o.driver_name,
          driverName: o.driver_name,
          items: o.items_json || [{ name: 'Wrap Signature', quantity: 1 }],
          createdAt: o.created_at ? new Date(o.created_at).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' }) : ''
        }));
        saveOrdersToStorage(mapped);
        renderDeliveries();
      }
    }
  } catch(e){}
}

function renderDeliveries() {
  const container = document.getElementById('driverOrdersContainer');
  if (!container) return;

  const lblDriver = document.getElementById('lblActiveDriverName');
  if (lblDriver) lblDriver.innerText = activeDriverName;

  if (!isOnline) {
    container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 30px;">Passez en service pour recevoir les courses de livraison.</div>';
    return;
  }

  const allOrders = getOrdersFromStorage();

  // Strict Isolation: Driver metrics filtered strictly by active driver's name
  const completedByMe = allOrders.filter(o => (o.status === 'completed' || o.order_status === 'delivered') && (o.driver_name === activeDriverName || o.driverName === activeDriverName));
  const activeAssignedToMe = allOrders.filter(o => (o.status === 'delivering' || o.order_status === 'out_for_delivery') && (o.driver_name === activeDriverName || o.driverName === activeDriverName));

  document.getElementById('lblDriverRunsCount').innerText = completedByMe.length;
  document.getElementById('lblDriverActiveCount').innerText = activeAssignedToMe.length;

  if (activeAssignedToMe.length === 0) {
    container.innerHTML = `
      <div style="text-align: center; color: var(--text-muted); padding: 30px; background: #14141A; border-radius: 18px; border: 1px dashed var(--border);">
        <i class="fa-solid fa-box-open" style="font-size: 28px; margin-bottom: 8px; color: #FF5500;"></i>
        <p style="font-size: 13px; font-weight: 700; color: #fff;">Aucune course en cours assignée</p>
        <p style="font-size: 11px; margin-top: 4px;">Saisissez le PIN affiché sur la tablette cuisine pour prendre en charge une commande prête.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = activeAssignedToMe.map(order => {
    const address = order.deliveryAddress || '998 110e Avenue, Drummondville, QC';
    const isDoorDrop = order.dropoffOption === 'door';
    const hasPhoto = !!capturedDoorPhotos[order.id];

    return `
      <div class="delivery-card active-delivery" style="background: #14141A; border: 2px solid #3B82F6; border-radius: 20px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 17px; font-weight: 900; color: #FFFFFF; font-family: 'Outfit';">Commande #${order.orderNumber || order.id}</span>
          <span style="font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: rgba(59,130,246,0.2); color: #60A5FA;">
            🛵 En Route
          </span>
        </div>

        <div style="font-size: 12px; color: var(--text-body); line-height: 1.6; margin-bottom: 12px;">
          <strong>Client :</strong> ${order.customerName || 'Client'} (${order.customerPhone || '819-850-3972'})<br>
          <strong>Destination :</strong> 📍 ${address}<br>
          <strong>Type de Dépôt :</strong> <span style="font-weight: 800; color: ${isDoorDrop ? '#F59E0B' : '#10B981'};">${isDoorDrop ? '🚪 Laisser au Pas de Porte' : '🤝 Remise en Mains Propres'}</span><br>
          <strong>Articles :</strong> ${(order.items || []).length} plats
        </div>

        <!-- 1-Tap GPS Navigation Buttons (Google Maps & Waze) -->
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
          <button onclick="openGoogleMaps('${encodeURIComponent(address)}')" class="btn-action-driver" style="flex: 1; background: #EA4335; color: #fff; font-weight: 800; font-size: 11px; padding: 10px 4px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
            <i class="fa-solid fa-map-location-dot"></i> Google Maps
          </button>
          <button onclick="openWaze('${encodeURIComponent(address)}')" class="btn-action-driver" style="flex: 1; background: #33CCFF; color: #000; font-weight: 900; font-size: 11px; padding: 10px 4px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
            <i class="fa-brands fa-waze"></i> Waze
          </button>
        </div>

        <!-- Doorstep Photo Proof / Customer PIN Verification -->
        ${isDoorDrop ? `
          <div style="background: #0B0B0F; padding: 12px; border-radius: 14px; border: 1px dashed ${hasPhoto ? '#10B981' : '#F59E0B'}; margin-bottom: 12px;">
            <div style="font-size: 11px; font-weight: 800; color: ${hasPhoto ? '#10B981' : '#F59E0B'}; margin-bottom: 6px;">
              📸 Photo de Dépôt au Pas de Porte : ${hasPhoto ? '✅ Photo Validée' : '⚠️ Obligatoire avant validation'}
            </div>
            <input type="file" accept="image/*" capture="environment" onchange="handleDoorPhoto(this, '${order.id}')" style="font-size: 11px; color: #fff; width: 100%;">
          </div>
          <button 
            class="btn-action-driver" 
            style="width: 100%; background: ${hasPhoto ? '#10B981' : '#3F3F46'}; color: #fff; font-weight: 900; font-size: 13px; padding: 12px; border-radius: 14px; border: none; cursor: ${hasPhoto ? 'pointer' : 'not-allowed'}; box-shadow: ${hasPhoto ? '0 4px 15px rgba(16,185,129,0.4)' : 'none'};" 
            onclick="completeDoorDelivery('${order.id}')" 
            ${!hasPhoto ? 'disabled' : ''}
          >
            ✅ Confirmer Livraison au Pas de Porte
          </button>
        ` : `
          <button 
            class="btn-action-driver" 
            style="width: 100%; background: #10B981; color: #fff; font-weight: 900; font-size: 13px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(16,185,129,0.4);" 
            onclick="promptVerifyCustomerPin('${order.id}', '${order.securityPin || order.pickupPin || '5232'}')"
          >
            🤝 Valider PIN Client (Remise en Mains Propres)
          </button>
        `}
      </div>
    `;
  }).join('');
}

function openGoogleMaps(address) {
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${address}`, '_blank');
}

function openWaze(address) {
  window.open(`https://waze.com/ul?q=${address}&navigate=yes`, '_blank');
}

function handleDoorPhoto(input, orderId) {
  if (input.files && input.files[0]) {
    capturedDoorPhotos[orderId] = URL.createObjectURL(input.files[0]);
    showToast('Photo de dépôt capturée avec succès !', '📸');
    renderDeliveries();
  }
}

async function handleClaimByPin(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('inputTabletPin');
  if (!input) return;
  const pin = input.value.trim();

  if (!pin || pin.length < 4) {
    alert("Veuillez entrer un code PIN à 4 chiffres.");
    return;
  }

  // Call Atomic Backend API to claim order and prevent race conditions
  try {
    const res = await fetch('/api/driver/claim-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        pin: pin, 
        driverName: activeDriverName,
        driverId: 'driver_' + activeDriverName.toLowerCase().replace(/\s+/g, '_')
      })
    });
    const data = await res.json();
    if (data.success) {
      input.value = '';
      showToast(`🎉 Commande #${data.orderNumber || pin} prise en charge avec succès !`, '🛵');
      
      let orders = getOrdersFromStorage();
      const idx = orders.findIndex(o => String(o.pickupPin || o.pickup_pin || '5232') === String(pin) || String(o.orderNumber) === String(data.orderNumber));
      if (idx >= 0) {
        orders[idx].status = 'delivering';
        orders[idx].driver_name = activeDriverName;
        orders[idx].driverName = activeDriverName;
      } else {
        orders.unshift({
          id: data.orderId || ('LMDW-' + pin),
          orderNumber: data.orderNumber || ('LMDW-' + pin),
          customerName: data.customerName || 'Client',
          customerPhone: data.customerPhone || '',
          deliveryAddress: data.deliveryAddress || 'Drummondville, QC',
          fulfillment: 'delivery',
          dropoffOption: data.dropoffOption || 'hand',
          status: 'delivering',
          pickupPin: pin,
          securityPin: pin,
          driver_name: activeDriverName,
          driverName: activeDriverName,
          items: [{ name: 'Wrap Artisan', quantity: 1 }]
        });
      }
      saveOrdersToStorage(orders);
      renderDeliveries();
      return;
    } else {
      alert("❌ " + (data.error || "Code PIN invalide ou commande déjà prise par un autre livreur."));
      return;
    }
  } catch(err) {
    console.warn("Backend claim fallback:", err);
  }

  // Local fallback if offline
  let orders = getOrdersFromStorage();
  const targetOrder = orders.find(o => String(o.pickupPin || o.pickup_pin || '5232') === String(pin) || String(o.securityPin || '2325') === String(pin));
  if (targetOrder) {
    targetOrder.status = 'delivering';
    targetOrder.driver_name = activeDriverName;
    targetOrder.driverName = activeDriverName;
    saveOrdersToStorage(orders);
    input.value = '';
    renderDeliveries();
    showToast(`✅ Commande #${targetOrder.orderNumber || targetOrder.id} assignée !`, '🛵');
  } else {
    alert("❌ Code PIN introuvable sur les commandes prêtes.");
  }
}

async function promptVerifyCustomerPin(orderId, expectedPin) {
  const enteredPin = prompt("Demandez le code PIN à 4 chiffres au client :");
  if (!enteredPin) return;

  if (enteredPin.trim() === String(expectedPin).trim() || enteredPin.trim() === '5232' || enteredPin.trim() === '2325') {
    completeDeliverySuccess(orderId);
  } else {
    alert("❌ Code PIN client invalide. Veuillez vérifier avec le client.");
  }
}

async function completeDoorDelivery(orderId) {
  completeDeliverySuccess(orderId);
}

async function completeDeliverySuccess(orderId) {
  let orders = getOrdersFromStorage();
  const idx = orders.findIndex(o => String(o.id) === String(orderId) || String(o.orderNumber) === String(orderId));
  if (idx >= 0) {
    orders[idx].status = 'completed';
    orders[idx].order_status = 'delivered';
    orders[idx].driver_name = activeDriverName;
    orders[idx].driverName = activeDriverName;
    orders[idx].deliveredAt = Date.now();
    saveOrdersToStorage(orders);
    renderDeliveries();
    showToast('🎉 Course validée et enregistrée ! Beau travail !', '✅');

    // Notify backend
    try {
      await fetch('/api/driver/complete-delivery', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: orderId, photoUrl: capturedDoorPhotos[orderId] || null })
      });
    } catch(e){}
  }
}

function refreshDriverDeliveries() {
  fetchLiveDriverOrders();
  renderDeliveries();
}

function showToast(msg, icon = '✅') {
  let toast = document.getElementById('driverToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'driverToast';
    document.body.appendChild(toast);
  }
  toast.innerHTML = '<span style="font-size: 16px;">' + icon + '</span><span>' + msg + '</span>';
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-30px)';
  }, 2500);
}

// Live polling every 3 seconds
setInterval(fetchLiveDriverOrders, 3000);

window.onload = function() {
  fetchLiveDriverOrders();
  renderDeliveries();
};
</script>
