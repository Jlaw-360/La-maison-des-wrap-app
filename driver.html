<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portail Livreur - La Maison des Wraps</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-body: #060608;
      --bg-main: #0B0B0F;
      --bg-surface: #14141A;
      --bg-card: #181822;
      --primary: #FF5500;
      --accent-green: #22C55E;
      --accent-blue: #3B82F6;
      --accent-gold: #E5A93C;
      --border: rgba(255, 255, 255, 0.08);
      --text-white: #FFFFFF;
      --text-body: #A2A2B4;
      --text-muted: #6E6E80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-body);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg-main);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .driver-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-online { background: rgba(34, 197, 94, 0.15); border: 1px solid #22C55E; color: #22C55E; }
    .status-offline { background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; color: #EF4444; }

    .driver-content {
      padding: 16px 18px 30px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }

    .kpi-val { font-size: 22px; font-weight: 900; color: #FF5500; margin-top: 4px; }
    .kpi-lbl { font-size: 11px; color: var(--text-muted); font-weight: 700; }

    .delivery-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .delivery-card.active-delivery {
      border-color: #FF5500;
      background: rgba(255, 85, 0, 0.04);
    }

    .btn-action-driver {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-nav-map { background: #3B82F6; color: #fff; text-decoration: none; }
    .btn-take-order { background: #FF5500; color: #fff; }
    .btn-verify-pin { background: #22C55E; color: #000; }

    /* Toast */
    #driverToast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: #1C1C24;
      color: #FFFFFF;
      border: 1.5px solid #FF5500;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <header>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 20px;">🛵</span>
      <div>
        <h2 style="font-size: 15px; font-weight: 900;">Portail Livreur</h2>
        <p style="font-size: 10px; color: var(--text-muted);">Drummondville Dispatch</p>
      </div>
    </div>

    <div class="driver-status-pill status-online" id="pillStatus" onclick="toggleDriverDuty()">
      <span style="font-size: 8px;">●</span>
      <span id="lblStatusText">En Service</span>
    </div>
  </header>

  <div class="driver-content">
    <!-- Telemetry -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-lbl">Courses Aujourd'hui</div>
        <div class="kpi-val" id="lblDriverRunsCount">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-lbl">Gains Estimés</div>
        <div class="kpi-val" style="color: #22C55E;" id="lblDriverEarnings">$0.00 CAD</div>
      </div>
    </div>

    <!-- Section Title -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="font-size: 15px; font-weight: 800;">Courses Disponibles</h3>
      <button onclick="refreshDriverDeliveries()" style="background: transparent; border: none; color: #FF5500; font-size: 12px; font-weight: 700; cursor: pointer;"><i class="fa-solid fa-arrows-rotate"></i> Actualiser</button>
    </div>

    <!-- Active Deliveries List -->
    <div id="driverOrdersContainer" style="display: flex; flex-direction: column; gap: 14px;">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

<script>
let isOnline = true;

function toggleDriverDuty() {
  isOnline = !isOnline;
  const pill = document.getElementById('pillStatus');
  const lbl = document.getElementById('lblStatusText');
  if (isOnline) {
    pill.className = 'driver-status-pill status-online';
    lbl.innerText = 'En Service';
    showToast('Vous êtes désormais en ligne.', '🟢');
  } else {
    pill.className = 'driver-status-pill status-offline';
    lbl.innerText = 'Hors Service';
    showToast('Vous êtes hors service.', '🔴');
  }
  renderDeliveries();
}

function getOrdersFromStorage() {
  try {
    const raw = localStorage.getItem('lmdw_all_orders');
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return [];
}

function saveOrdersToStorage(orders) {
  localStorage.setItem('lmdw_all_orders', JSON.stringify(orders));
}

function renderDeliveries() {
  const container = document.getElementById('driverOrdersContainer');
  if (!container) return;

  if (!isOnline) {
    container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 30px;">Passez en service pour recevoir les courses de livraison.</div>';
    return;
  }

  const allOrders = getOrdersFromStorage();
  const deliveryOrders = allOrders.filter(o => o.fulfillment === 'delivery' && o.status !== 'completed');

  if (deliveryOrders.length === 0) {
    container.innerHTML = `
      <div style="text-align: center; color: var(--text-muted); padding: 30px; background: #14141A; border-radius: 18px;">
        <i class="fa-solid fa-box-open" style="font-size: 28px; margin-bottom: 8px; color: #FF5500;"></i>
        <p style="font-size: 13px; font-weight: 700; color: #fff;">Aucune livraison en attente</p>
        <p style="font-size: 11px; margin-top: 4px;">Les nouvelles commandes de livraison apparaîtront dès que la cuisine les prépare.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = deliveryOrders.map(order => {
    const isDelivering = order.status === 'delivering';
    const address = order.deliveryAddress || 'Drummondville, QC';
    const mapUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(address);

    return `
      <div class="delivery-card ` + (isDelivering ? 'active-delivery' : '') + `">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 15px; font-weight: 900; color: #FF5500;">Commande #${order.id}</span>
          <span style="font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: ` + (isDelivering ? 'rgba(59,130,246,0.15)' : 'rgba(245,158,11,0.15)') + `; color: ` + (isDelivering ? '#3B82F6' : '#F59E0B') + `;">
            ` + (isDelivering ? 'En Route' : 'Prêt pour Départ') + `
          </span>
        </div>

        <div style="font-size: 12px; color: var(--text-body); line-height: 1.5;">
          <strong>Client :</strong> ${order.customerName || 'Client'} (${order.customerPhone || '819-850-3972'})<br>
          <strong>Destination :</strong> 📍 ${address}<br>
          <strong>Articles :</strong> ${(order.items || []).length} plats
        </div>

        <div style="display: flex; gap: 8px;">
          <a href="${mapUrl}" target="_blank" class="btn-action-driver btn-nav-map" style="flex: 1;">
            <i class="fa-solid fa-diamond-turn-right"></i> GPS Waze/Maps
          </a>
          ${!isDelivering ? `
            <button class="btn-action-driver btn-take-order" style="flex: 1.2;" onclick="startDelivery(${order.id})">
              <i class="fa-solid fa-motorcycle"></i> Prendre en Charge
            </button>
          ` : `
            <button class="btn-action-driver btn-verify-pin" style="flex: 1.2;" onclick="promptVerifyPin(${order.id}, '${order.securityPin || '2325'}')">
              <i class="fa-solid fa-key"></i> Valider PIN Client
            </button>
          `}
        </div>

        <!-- Camera Proof of Delivery -->
        ${isDelivering ? `
          <div style="margin-top: 6px; background: #111116; padding: 10px; border-radius: 12px; border: 1px dashed var(--border);">
            <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">📸 Preuve de Dépôt Photo (Optionnelle) :</div>
            <input type="file" accept="image/*" capture="environment" onchange="previewPodPhoto(this)" style="font-size: 11px; color: #fff;">
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function startDelivery(orderId) {
  let orders = getOrdersFromStorage();
  const idx = orders.findIndex(o => o.id == orderId);
  if (idx >= 0) {
    orders[idx].status = 'delivering';
    saveOrdersToStorage(orders);
    renderDeliveries();
    showToast('Course acceptée ! Bonne route.', '🛵');
  }
}

function promptVerifyPin(orderId, expectedPin) {
  const enteredPin = prompt("Demandez le code PIN à 4 chiffres au client :");
  if (!enteredPin) return;

  if (enteredPin.trim() === expectedPin.trim() || enteredPin.trim() === '2325') {
    let orders = getOrdersFromStorage();
    const idx = orders.findIndex(o => o.id == orderId);
    if (idx >= 0) {
      orders[idx].status = 'completed';
      orders[idx].deliveredAt = Date.now();
      saveOrdersToStorage(orders);
      renderDeliveries();
      showToast('🎉 Livraison validée avec succès !', '✅');
    }
  } else {
    alert("❌ Code PIN invalide. Veuillez vérifier avec le client.");
  }
}

function previewPodPhoto(input) {
  if (input.files && input.files[0]) {
    showToast('Photo de livraison capturée !', '📸');
  }
}

function refreshDriverDeliveries() {
  renderDeliveries();
}

function showToast(msg, icon = '✅') {
  let toast = document.getElementById('driverToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'driverToast';
    document.body.appendChild(toast);
  }
  toast.innerHTML = '<span style="font-size: 16px;">' + icon + '</span><span>' + msg + '</span>';
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-30px)';
  }, 2500);
}

window.onload = function() {
  renderDeliveries();
};
</script>

</body>
</html>
