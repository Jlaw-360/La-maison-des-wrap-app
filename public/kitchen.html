<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuisine KDS Tablette - La Maison des Wraps</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101014">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #FF5500;
      --primary-hover: #E04B00;
      --bg-dark: #0B0B0F;
      --surface-card: #14141A;
      --surface-elevated: #1C1C24;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #FFFFFF;
      --text-muted: #A0A0B0;
      --badge-new: #3B82F6;
      --badge-prep: #F59E0B;
      --badge-ready: #10B981;
      --timer-green: #10B981;
      --timer-orange: #F59E0B;
      --timer-red: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: var(--surface-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-kds-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-kds-header:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-chime-toggle.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: #22C55E;
      color: #22C55E;
    }

    /* KANBAN BOARD (10-Inch Landscape Responsive) */
    .kanban-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 16px 24px 24px 24px;
      overflow-x: auto;
    }

    @media (max-width: 900px) {
      .kanban-container {
        grid-template-columns: 1fr;
      }
    }

    .kanban-column {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 90px);
      overflow: hidden;
    }

    .kanban-col-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
    }

    .badge-count {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .kanban-col-body {
      padding: 14px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ticket-card {
      background: var(--surface-elevated);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      animation: fadeIn 0.3s ease;
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }

    .ticket-id {
      font-size: 16px;
      font-weight: 900;
      color: #FFFFFF;
    }

    .ticket-timer {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .timer-green { background: rgba(16, 185, 129, 0.15); color: #10B981; }
    .timer-orange { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
    .timer-red { background: rgba(239, 68, 68, 0.2); color: #EF4444; animation: pulse 1s infinite alternate; }

    @keyframes pulse { 0% { opacity: 0.8; } 100% { opacity: 1; } }

    .ticket-customer-info {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .ticket-items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
    }

    .ticket-item-row {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid #FF5500;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .btn-bump {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-bump-prep {
      background: #F59E0B;
      color: #000;
    }

    .btn-bump-ready {
      background: #10B981;
      color: #000;
    }

    .btn-bump-complete {
      background: #3B82F6;
      color: #fff;
    }

    /* Shift Report Modal */
    .kds-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .kds-modal-backdrop.open { display: flex; }

    .kds-modal-box {
      width: 90%;
      max-width: 480px;
      background: #14141A;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand-title">
    <span style="color: #FF5500;">🍳 KITCHEN KDS</span>
    <span style="font-size: 14px; font-weight: 600; color: var(--text-muted);">| La Maison des Wraps</span>
  </div>

  <div class="header-actions">
    <button class="btn-kds-header btn-chime-toggle active" id="btnChime" onclick="toggleAudioChime()">
      <i class="fa-solid fa-volume-high"></i>
      <span id="lblChime">Sonnerie Active</span>
    </button>
    <button class="btn-kds-header" onclick="openShiftReport()">
      <i class="fa-solid fa-file-invoice"></i>
      <span>Rapport de Service</span>
    </button>
    <button class="btn-kds-header" onclick="refreshKdsOrders()">
      <i class="fa-solid fa-arrows-rotate"></i>
      <span>Actualiser</span>
    </button>
  </div>
</header>

<div class="kanban-container">
  <!-- COLUMN 1: NOUVELLES COMMANDES -->
  <div class="kanban-column">
    <div class="kanban-col-head" style="border-top: 4px solid var(--badge-new);">
      <span><i class="fa-solid fa-bell" style="color: var(--badge-new); margin-right: 6px;"></i> NOUVELLES COMMANDES</span>
      <span class="badge-count" style="background: rgba(59, 130, 246, 0.2); color: var(--badge-new);" id="countNew">0</span>
    </div>
    <div class="kanban-col-body" id="colNew">
      <!-- Tickets -->
    </div>
  </div>

  <!-- COLUMN 2: EN PRÉPARATION -->
  <div class="kanban-column">
    <div class="kanban-col-head" style="border-top: 4px solid var(--badge-prep);">
      <span><i class="fa-solid fa-fire-burner" style="color: var(--badge-prep); margin-right: 6px;"></i> EN PRÉPARATION</span>
      <span class="badge-count" style="background: rgba(245, 158, 11, 0.2); color: var(--badge-prep);" id="countPrep">0</span>
    </div>
    <div class="kanban-col-body" id="colPrep">
      <!-- Tickets -->
    </div>
  </div>

  <!-- COLUMN 3: PRÊT POUR CUEILLETTE / LIVRAISON -->
  <div class="kanban-column">
    <div class="kanban-col-head" style="border-top: 4px solid var(--badge-ready);">
      <span><i class="fa-solid fa-check-circle" style="color: var(--badge-ready); margin-right: 6px;"></i> PRÊT AU COMPTOIR</span>
      <span class="badge-count" style="background: rgba(16, 185, 129, 0.2); color: var(--badge-ready);" id="countReady">0</span>
    </div>
    <div class="kanban-col-body" id="colReady">
      <!-- Tickets -->
    </div>
  </div>
</div>

<!-- Shift Report Modal -->
<div class="kds-modal-backdrop" id="shiftModal">
  <div class="kds-modal-box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 18px; font-weight: 800; font-family: 'Outfit';">📊 Rapport de Service Cuisine</h2>
      <button onclick="closeShiftReport()" style="background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;">
      <div style="background: #1C1C24; padding: 14px; border-radius: 14px; border: 1px solid var(--border);">
        <div style="font-size: 11px; color: var(--text-muted);">Commandes Traitées</div>
        <div style="font-size: 24px; font-weight: 900; color: #FF5500;" id="lblShiftTotalOrders">0</div>
      </div>
      <div style="background: #1C1C24; padding: 14px; border-radius: 14px; border: 1px solid var(--border);">
        <div style="font-size: 11px; color: var(--text-muted);">Temps Moyen de Préparation</div>
        <div style="font-size: 24px; font-weight: 900; color: #10B981;" id="lblShiftAvgTime">12 min</div>
      </div>
    </div>

    <p style="font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px;">
      Toutes les commandes terminées sont archivées dans le journal d'audit de la direction.
    </p>

    <button type="button" class="btn-bump btn-bump-complete" onclick="closeShiftReport()">Fermer le Rapport</button>
  </div>
</div>

<script>
let chimeEnabled = true;
let knownOrderIds = new Set();

// Web Audio API Synthesizer Chime
function playTicketChime() {
  if (!chimeEnabled) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();

    // Two-tone bright kitchen chime
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();

    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
    osc1.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5

    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(880, ctx.currentTime);
    osc2.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.15); // D6

    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);

    osc1.start();
    osc2.start();
    osc1.stop(ctx.currentTime + 0.8);
    osc2.stop(ctx.currentTime + 0.8);
  } catch (e) {}
}

function toggleAudioChime() {
  chimeEnabled = !chimeEnabled;
  const btn = document.getElementById('btnChime');
  const lbl = document.getElementById('lblChime');
  if (chimeEnabled) {
    btn.classList.add('active');
    lbl.innerText = 'Sonnerie Active';
    playTicketChime();
  } else {
    btn.classList.remove('active');
    lbl.innerText = 'Sonnerie Muette';
  }
}

function getOrdersFromStorage() {
  try {
    const raw = localStorage.getItem('lmdw_all_orders');
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return [];
}

function saveOrdersToStorage(orders) {
  localStorage.setItem('lmdw_all_orders', JSON.stringify(orders));
}

function getTimerClass(createdTimestamp) {
  if (!createdTimestamp) return 'timer-green';
  const elapsedMin = Math.floor((Date.now() - createdTimestamp) / 60000);
  if (elapsedMin < 10) return 'timer-green';
  if (elapsedMin < 20) return 'timer-orange';
  return 'timer-red';
}

function getElapsedText(createdTimestamp) {
  if (!createdTimestamp) return '0 min';
  const elapsedMin = Math.floor((Date.now() - createdTimestamp) / 60000);
  return elapsedMin + ' min';
}

function renderKanban() {
  const orders = getOrdersFromStorage();

  const colNew = document.getElementById('colNew');
  const colPrep = document.getElementById('colPrep');
  const colReady = document.getElementById('colReady');

  let listNew = [];
  let listPrep = [];
  let listReady = [];

  let hasNewTicket = false;

  orders.forEach(order => {
    if (!order.status || order.status === 'new') {
      listNew.push(order);
      if (!knownOrderIds.has(order.id)) {
        knownOrderIds.add(order.id);
        hasNewTicket = true;
      }
    } else if (order.status === 'prep') {
      listPrep.push(order);
      knownOrderIds.add(order.id);
    } else if (order.status === 'ready' || order.status === 'delivering') {
      listReady.push(order);
      knownOrderIds.add(order.id);
    }
  });

  if (hasNewTicket && knownOrderIds.size > 1) {
    playTicketChime();
  }

  document.getElementById('countNew').innerText = listNew.length;
  document.getElementById('countPrep').innerText = listPrep.length;
  document.getElementById('countReady').innerText = listReady.length;

  colNew.innerHTML = listNew.length === 0 ? '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Aucune nouvelle commande.</div>' : listNew.map(o => renderTicket(o, 'new')).join('');
  colPrep.innerHTML = listPrep.length === 0 ? '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Aucune commande en préparation.</div>' : listPrep.map(o => renderTicket(o, 'prep')).join('');
  colReady.innerHTML = listReady.length === 0 ? '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Aucune commande prête.</div>' : listReady.map(o => renderTicket(o, 'ready')).join('');
}

function renderTicket(order, stage) {
  const timerClass = getTimerClass(order.createdTimestamp);
  const elapsed = getElapsedText(order.createdTimestamp);

  let btnAction = '';
  if (stage === 'new') {
    btnAction = `<button class="btn-bump btn-bump-prep" onclick="advanceOrderStatus(${order.id}, 'prep')"><i class="fa-solid fa-play"></i> Démarrer Préparation</button>`;
  } else if (stage === 'prep') {
    btnAction = `<button class="btn-bump btn-bump-ready" onclick="advanceOrderStatus(${order.id}, 'ready')"><i class="fa-solid fa-check"></i> Marquer Prêt</button>`;
  } else {
    btnAction = `<button class="btn-bump btn-bump-complete" onclick="advanceOrderStatus(${order.id}, 'completed')"><i class="fa-solid fa-box-archive"></i> Terminer & Archiver</button>`;
  }

  const itemsHtml = (order.items || []).map(it => `
    <div class="ticket-item-row">
      ${it.name}
    </div>
  `).join('');

  return `
    <div class="ticket-card">
      <div class="ticket-header">
        <span class="ticket-id">#${order.id}</span>
        <span class="ticket-timer ${timerClass}"><i class="fa-regular fa-clock"></i> ${elapsed} (${order.createdAt || ''})</span>
      </div>
      <div class="ticket-customer-info">
        <span>👤 ${order.customerName || 'Client'}</span>
        <span style="font-weight: 800; color: #FF5500;">${order.fulfillment === 'delivery' ? '🛵 Livraison' : '🛍️ Cueillette'}</span>
      </div>
      <div class="ticket-items-list">
        ${itemsHtml}
      </div>
      ${btnAction}
    </div>
  `;
}

function advanceOrderStatus(orderId, nextStatus) {
  let orders = getOrdersFromStorage();
  const idx = orders.findIndex(o => o.id == orderId);
  if (idx >= 0) {
    orders[idx].status = nextStatus;
    if (nextStatus === 'completed') {
      orders[idx].completedAt = Date.now();
    }
    saveOrdersToStorage(orders);
    renderKanban();
  }
}

function refreshKdsOrders() {
  renderKanban();
}

function openShiftReport() {
  const orders = getOrdersFromStorage();
  document.getElementById('lblShiftTotalOrders').innerText = orders.length;
  document.getElementById('shiftModal').classList.add('open');
}

function closeShiftReport() {
  document.getElementById('shiftModal').classList.remove('open');
}

// Auto poll every 3 seconds for live tickets
setInterval(renderKanban, 3000);
window.onload = function() {
  renderKanban();
};
</script>

</body>
</html>
